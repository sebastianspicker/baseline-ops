name: ci

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - dev
      - 'fix/**'
      - 'feat/**'
      - 'update-*'
      - 'update/**'
  pull_request:
    branches:
      - main
      - dev
      - 'fix/**'
      - 'feat/**'

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static checks
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      PSSCRIPTANALYZER_VERSION: '1.24.0'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache PowerShell modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~\Documents\WindowsPowerShell\Modules
            ~\Documents\PowerShell\Modules
          key: psmodules-${{ runner.os }}-psscriptanalyzer-${{ env.PSSCRIPTANALYZER_VERSION }}

      - name: Ensure PSScriptAnalyzer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${env:PSSCRIPTANALYZER_VERSION}"
          $installed = Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object { $_.Version -eq $version }
          if (-not $installed) {
            Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted
            Install-Module -Name PSScriptAnalyzer -RequiredVersion $version -Scope CurrentUser -Force
          }

      - name: Secret scan (basic)
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\secret-scan.ps1 -RootPath $env:GITHUB_WORKSPACE

      - name: Static checks
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\verify.ps1 -RootPath $env:GITHUB_WORKSPACE

  test-windows:
    name: Pester (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    needs: verify
    timeout-minutes: 20
    env:
      PESTER_VERSION: '5.7.1'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Cache PowerShell modules
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7 # v5.0.4
        with:
          path: |
            ~\Documents\WindowsPowerShell\Modules
            ~\Documents\PowerShell\Modules
          key: psmodules-${{ runner.os }}-pester-${{ env.PESTER_VERSION }}

      - name: Ensure Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:PESTER_VERSION
          $installed = Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -eq $version }
          if (-not $installed) {
            Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted
            Install-Module -Name Pester -RequiredVersion $version -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Run Pester in a trusted Windows workspace
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $trustedRoot = Join-Path $env:ProgramData "WinMdmCi-$env:GITHUB_RUN_ID"
          $trustedWorkspace = Join-Path $trustedRoot 'workspace'
          $testTemp = Join-Path $trustedRoot 'temp'
          $runnerScript = Join-Path $trustedRoot 'run-pester.ps1'
          $pesterDestination = Join-Path $trustedRoot 'Pester'
          $taskName = "WinMdmCi-$env:GITHUB_RUN_ID"
          $pester = Get-Module -ListAvailable -Name Pester |
            Where-Object Version -eq $env:PESTER_VERSION |
            Select-Object -First 1
          if ($null -eq $pester) { throw "Pester $env:PESTER_VERSION is unavailable." }

          New-Item -Path $trustedRoot, $testTemp -ItemType Directory -Force | Out-Null
          Copy-Item -LiteralPath $env:GITHUB_WORKSPACE -Destination $trustedWorkspace -Recurse -Force
          Copy-Item -LiteralPath $pester.ModuleBase -Destination $pesterDestination -Recurse -Force
          @"
          `$ErrorActionPreference = 'Stop'
          `$env:TEMP = '$testTemp'
          `$env:TMP = '$testTemp'
          Import-Module '$pesterDestination\Pester.psd1' -Force
          Set-Location '$trustedWorkspace'
          `$configuration = New-PesterConfiguration
          `$configuration.Run.Path = '.\tests'
          `$configuration.Run.PassThru = `$true
          `$configuration.Output.Verbosity = 'Detailed'
          `$configuration.Output.CIFormat = 'GithubActions'
          `$configuration.TestResult.Enabled = `$true
          `$configuration.TestResult.OutputPath = 'testResults.xml'
          `$result = Invoke-Pester -Configuration `$configuration
          exit [Math]::Min([int]`$result.FailedCount, 255)
          "@ | Set-Content -LiteralPath $runnerScript -Encoding utf8

          $administrators = New-Object Security.Principal.SecurityIdentifier('S-1-5-32-544')
          $system = New-Object Security.Principal.SecurityIdentifier('S-1-5-18')
          $runner = [Security.Principal.WindowsIdentity]::GetCurrent().User
          $inheritance = [Security.AccessControl.InheritanceFlags]::ContainerInherit -bor
            [Security.AccessControl.InheritanceFlags]::ObjectInherit
          $items = @(Get-ChildItem -LiteralPath $trustedRoot -Recurse -Force) |
            Sort-Object { $_.FullName.Length } -Descending
          $items += Get-Item -LiteralPath $trustedRoot -Force
          foreach ($item in $items) {
            $isDirectory = $item -is [System.IO.DirectoryInfo]
            $security = if ($isDirectory) {
              New-Object Security.AccessControl.DirectorySecurity
            } else {
              New-Object Security.AccessControl.FileSecurity
            }
            $security.SetOwner($administrators)
            $security.SetAccessRuleProtection($true, $false)
            $itemInheritance = if ($isDirectory) {
              $inheritance
            } else {
              [Security.AccessControl.InheritanceFlags]::None
            }
            foreach ($sid in @($administrators, $system)) {
              [void]$security.AddAccessRule((New-Object Security.AccessControl.FileSystemAccessRule(
                    $sid,
                    [Security.AccessControl.FileSystemRights]::FullControl,
                    $itemInheritance,
                    [Security.AccessControl.PropagationFlags]::None,
                    [Security.AccessControl.AccessControlType]::Allow)))
            }
            [void]$security.AddAccessRule((New-Object Security.AccessControl.FileSystemAccessRule(
                  $runner,
                  [Security.AccessControl.FileSystemRights]::ReadAndExecute,
                  $itemInheritance,
                  [Security.AccessControl.PropagationFlags]::None,
                  [Security.AccessControl.AccessControlType]::Allow)))
            Set-Acl -LiteralPath $item.FullName -AclObject $security -ErrorAction Stop
          }

          $hostPath = (Get-Process -Id $PID -ErrorAction Stop).Path
          $action = New-ScheduledTaskAction -Execute $hostPath `
            -Argument "-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -File `"$runnerScript`""
          $principal = New-ScheduledTaskPrincipal -UserId 'SYSTEM' -LogonType ServiceAccount -RunLevel Highest
          $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 10)
          try {
            Register-ScheduledTask -TaskName $taskName -Action $action -Principal $principal -Settings $settings -Force | Out-Null
            Start-ScheduledTask -TaskName $taskName
            $deadline = [DateTime]::UtcNow.AddMinutes(8)
            do {
              Start-Sleep -Seconds 1
              $task = Get-ScheduledTask -TaskName $taskName
              $taskInfo = Get-ScheduledTaskInfo -TaskName $taskName
            } while (
              [DateTime]::UtcNow -lt $deadline -and
              ($task.State -eq 'Running' -or $taskInfo.LastRunTime.Year -le 1)
            )
            if ($task.State -eq 'Running' -or $taskInfo.LastRunTime.Year -le 1) {
              Stop-ScheduledTask -TaskName $taskName -ErrorAction SilentlyContinue
              throw 'The SYSTEM Pester task did not finish within eight minutes.'
            }
            $resultPath = Join-Path $trustedWorkspace 'testResults.xml'
            if (Test-Path -LiteralPath $resultPath -PathType Leaf) {
              Copy-Item -LiteralPath $resultPath -Destination (Join-Path $env:GITHUB_WORKSPACE 'testResults.xml') -Force
            }
            if ($taskInfo.LastTaskResult -ne 0) {
              throw "The SYSTEM Pester task failed with exit code $($taskInfo.LastTaskResult)."
            }
          } finally {
            Unregister-ScheduledTask -TaskName $taskName -Confirm:$false -ErrorAction SilentlyContinue
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: testResults.xml
          if-no-files-found: warn

      - name: Test summary
        if: always()
        shell: pwsh
        run: |
          if (Test-Path testResults.xml) {
            $xml = [xml](Get-Content testResults.xml)
            $root = $xml.'test-results'
            function Get-TestResultValue {
              param([string]$Name)
              $value = $root.$Name
              if ($null -eq $value -or $value -eq '') { return '0' }
              return [string]$value
            }
            $total = Get-TestResultValue 'total'
            $passed = Get-TestResultValue 'passed'
            $failed = Get-TestResultValue 'failures'
            $skipped = Get-TestResultValue 'skipped'
            $inconclusive = Get-TestResultValue 'inconclusive'
            $notRun = Get-TestResultValue 'not-run'
            "## Test Results`n| Metric | Count |`n|--------|-------|`n| Passed | $passed |`n| Failed | $failed |`n| Skipped | $skipped |`n| Inconclusive | $inconclusive |`n| Not run | $notRun |`n| Total | $total |" >> $env:GITHUB_STEP_SUMMARY
          }

  test-smoke-linux:
    # Smoke test on Linux: runs parse-only checks (no PSScriptAnalyzer) to
    # verify scripts are syntactically valid cross-platform.
    name: Smoke (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: verify
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Parse checks
        shell: pwsh
        run: |
          ./tools/verify.ps1 -RootPath $PWD -SkipAnalyzer

  fuzz-profile-validation:
    name: Fuzz profile validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: verify
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@fa2e9d605c4eeb9fcad4c99c224cee0c6c7f3594 # v2.16.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Run fuzz/property tests
        run: npm test
