name: ci

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Static checks
    runs-on: windows-latest
    permissions:
      contents: read
    timeout-minutes: 15
    env:
      PSSCRIPTANALYZER_VERSION: '1.24.0'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Cache PowerShell modules
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~\Documents\WindowsPowerShell\Modules
            ~\Documents\PowerShell\Modules
          key: psmodules-${{ runner.os }}-psscriptanalyzer-${{ env.PSSCRIPTANALYZER_VERSION }}

      - name: Ensure PSScriptAnalyzer
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $version = "${env:PSSCRIPTANALYZER_VERSION}"
          $installed = Get-Module -ListAvailable -Name PSScriptAnalyzer | Where-Object { $_.Version -eq $version }
          if (-not $installed) {
            Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted
            Install-Module -Name PSScriptAnalyzer -RequiredVersion $version -Scope CurrentUser -Force
          }

      - name: Secret scan (basic)
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\secret-scan.ps1 -RootPath $env:GITHUB_WORKSPACE

      - name: Static checks
        shell: powershell
        run: |
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\verify.ps1 -RootPath $env:GITHUB_WORKSPACE

  test-windows:
    name: Pester (Windows)
    runs-on: windows-latest
    permissions:
      contents: read
    needs: verify
    timeout-minutes: 20
    env:
      PESTER_VERSION: '5.7.1'
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Cache PowerShell modules
        uses: actions/cache@cdf6c1fa76f9f475f3d7449005a359c84ca0f306 # v5.0.3
        with:
          path: |
            ~\Documents\WindowsPowerShell\Modules
            ~\Documents\PowerShell\Modules
          key: psmodules-${{ runner.os }}-pester-${{ env.PESTER_VERSION }}

      - name: Ensure Pester
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:PESTER_VERSION
          $installed = Get-Module -ListAvailable -Name Pester | Where-Object { $_.Version -eq $version }
          if (-not $installed) {
            Set-PSRepository -Name 'PSGallery' -InstallationPolicy Trusted
            Install-Module -Name Pester -RequiredVersion $version -Scope CurrentUser -Force -SkipPublisherCheck
          }

      - name: Run Pester
        shell: pwsh
        run: |
          Invoke-Pester -Path .\tests -Output Detailed -CI

  test-smoke-linux:
    name: Smoke (Linux)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    needs: verify
    timeout-minutes: 15
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@0634a2670c59f64b4a01f0f96f84700a4088b9f0 # v2.12.0
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Parse checks
        shell: pwsh
        run: |
          ./tools/verify.ps1 -RootPath $PWD -SkipAnalyzer
